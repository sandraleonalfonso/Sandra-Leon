{%- assign t = site.data.i18n[page.lang] -%}
<footer class="site-footer">
  <div class="wrap">
    <p>{{ site.author.name }} · {{ t.affiliation | default: site.author.affiliation }}</p>
    <p class="footer-links">
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      {%- for p in site.author.profiles %} · <a href="{{ p.url }}" rel="me">{{ p.name }}</a>{% endfor %}
    </p>
  </div>
</footer>
